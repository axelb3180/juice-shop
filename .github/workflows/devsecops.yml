name: DevSecOps Pipeline

on:
  push:
    branches: [ devsecops-pipeline, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20' # Plus besoin de la ligne cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run unit tests
        run: npm test
